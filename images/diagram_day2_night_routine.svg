  <text x="400" y="65" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">🌙 Day 2 牛排夜行防呆動線：波之上海風 ➔ 投幣洗衣 ➔ 深度泡澡</text>

  <!-- Step 1 -->
  <g transform="translate(50, 115)">
