<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDiff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hdrDiff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="820" height="520" rx="16" fill="url(#bgDiff)"/>
  
  <!-- Header Banner -->
  <rect x="25" y="20" width="770" height="55" rx="12" fill="url(#hdrDiff)"/>
  <text x="410" y="55" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">🎌 日本退稅制度歷史性大改革：舊制 vs 2026 新制 5 大核心差異對照</text>

  <!-- Table Header -->
  <rect x="25" y="90" width="170" height="40" rx="8" fill="#334155"/>
  <text x="110" y="115" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">比較項目</text>

  <rect x="205" y="90" width="280" height="40" rx="8" fill="#475569"/>
  <text x="345" y="115" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">❌ 舊制（過去方式）</text>

  <rect x="495" y="90" width="300" height="40" rx="8" fill="#047857"/>
  <text x="645" y="115" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">✨ 2026 最新制（2026/11 起全面實施）</text>

  <!-- Row 1: 退稅模式 -->
  <rect x="25" y="140" width="170" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="178" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">1. 退稅付款方式</text>

  <rect x="205" y="140" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="168" fill="#f87171" font-size="12" font-weight="bold">【直接免稅】：</text>
  <text x="220" y="188" fill="#94a3b8" font-size="11">市區店家出示護照，直接以「未稅價」結帳。</text>

  <rect x="495" y="140" width="300" height="65" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="510" y="168" fill="#34d399" font-size="12" font-weight="bold">【先付後退】：</text>
  <text x="510" y="188" fill="#e2e8f0" font-size="11">市區先刷卡付「含稅價」，出境機場核驗後退至信用卡。</text>

  <!-- Row 2: 商品分類 -->
  <rect x="25" y="215" width="170" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="253" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">2. 商品分類限制</text>

  <rect x="205" y="215" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="243" fill="#f87171" font-size="12" font-weight="bold">【嚴格區分】：</text>
  <text x="220" y="263" fill="#94a3b8" font-size="11">分「一般品」與「消耗品」，各自滿 5,000 円不可合算。</text>

  <rect x="495" y="215" width="300" height="65" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="510" y="243" fill="#34d399" font-size="12" font-weight="bold">【取消分類，自由合併】：</text>
  <text x="510" y="263" fill="#e2e8f0" font-size="11">衣服、包包與零食、美妝可合併合計滿 5,000 円即可！</text>

  <!-- Row 3: 消耗品額度 -->
  <rect x="25" y="290" width="170" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="328" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">3. 消耗品金額上限</text>

  <rect x="205" y="290" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="318" fill="#f87171" font-size="12" font-weight="bold">【單日限額 50 萬円】：</text>
  <text x="220" y="338" fill="#94a3b8" font-size="11">每人每日同店消耗品上限 50 萬日圓。</text>

  <rect x="495" y="290" width="300" height="65" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="510" y="318" fill="#34d399" font-size="12" font-weight="bold">【無上限】：</text>
  <text x="510" y="338" fill="#e2e8f0" font-size="11">全面取消 50 萬日圓上限，自由採買免擔心超標！</text>

  <!-- Row 4: 包裝方式 -->
  <rect x="25" y="365" width="170" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="403" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">4. 包裝袋要求</text>

  <rect x="205" y="365" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="393" fill="#f87171" font-size="12" font-weight="bold">【強制封入紅膠帶密封袋】：</text>
  <text x="220" y="413" fill="#94a3b8" font-size="11">出境前絕不可拆封，包裝龐大難塞行李箱。</text>

  <rect x="495" y="365" width="300" height="65" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="510" y="393" fill="#34d399" font-size="12" font-weight="bold">【取消防拆特殊密封膠袋】：</text>
  <text x="510" y="413" fill="#e2e8f0" font-size="11">更方便收納於行李箱！（⚠️但境內仍不可消耗使用）</text>

  <!-- Row 5: 機場查驗 -->
  <rect x="25" y="440" width="170" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="478" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">5. 出境機場動線</text>

  <rect x="205" y="440" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="220" y="468" fill="#f87171" font-size="12" font-weight="bold">【先托運後過海關】：</text>
  <text x="220" y="488" fill="#94a3b8" font-size="11">行李直接托運，過安檢後在海關櫃檯刷護照抽查。</text>

  <rect x="495" y="440" width="300" height="65" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="510" y="468" fill="#fbbf24" font-size="12" font-weight="bold">【切勿先托運！先 KIOSK 核驗再托運】：</text>
  <text x="510" y="488" fill="#fef08a" font-size="11">推著行李至機台掃描護照 🟢綠燈托運 / 🔴紅燈開箱受檢！</text>
</svg>