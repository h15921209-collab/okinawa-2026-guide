<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="800" height="540" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
  <text x="400" y="42" text-anchor="middle" fill="#34d399" font-size="23" font-weight="900">🏨 【自由花園酒店 設施全攻略】電視看 YT/Netflix 秘訣 ＆ 1F/2F 免費神物</text>

  <!-- Left Top Box: TV & YouTube / Netflix Truth -->
  <rect x="25" y="64" width="370" height="225" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
  <rect x="25" y="64" width="370" height="42" rx="13" fill="#e11d48"/>
  <text x="210" y="92" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900">📺 房間電視能看 YouTube / Netflix 嗎？</text>
  <text x="42" y="128" fill="#fda4af" font-size="17" font-weight="900">❌ 實測真相：房內為「一般日本數位液晶電視」</text>
  <text x="42" y="152" fill="#e2e8f0" font-size="14" font-weight="700">（非內建 App 的智慧 TV，可直接看日本寶可夢/陀螺動畫台）</text>
  <rect x="40" y="166" width="340" height="108" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="54" y="192" fill="#fde047" font-size="16" font-weight="900">💡 秒變智慧 TV 看 YT / Netflix 兩大自備神器：</text>
  <text x="54" y="218" fill="#ffffff" font-size="14" font-weight="700">① 帶【Chromecast / 小米電視棒 / Fire TV Stick】</text>
  <text x="54" y="240" fill="#38bdf8" font-size="14" font-weight="700">② 或帶【手機轉 HDMI 投影線】插電視 HDMI 孔＋房內免費 Wi-Fi</text>
  <text x="54" y="262" fill="#a7f3d0" font-size="13" font-weight="700">（1F 櫃檯亦可免費借用手機充電器、有線網路線！）</text>

  <!-- Right Top Box: 1F & 2F Floor Facilities -->
  <rect x="410" y="64" width="365" height="225" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="410" y="64" width="365" height="42" rx="13" fill="#0284c7"/>
  <text x="592" y="92" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900">🏢 1樓 ＆ 2樓 必用公共設施位置</text>
  <rect x="426" y="118" width="333" height="75" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="440" y="142" fill="#38bdf8" font-size="16" font-weight="900">📍【1F 大廳】微波爐 ＆ 備品吧 ＆ 免費寄行李</text>
  <text x="440" y="164" fill="#e2e8f0" font-size="14" font-weight="700">• 免費微波爐（加熱 Main Place 超市半價熟食超神！）</text>
  <text x="440" y="184" fill="#e2e8f0" font-size="14" font-weight="700">• 免費公用電腦 ‧ 1F 餐廳早餐 (6:30-10:00 / ¥1,500)</text>

  <rect x="426" y="202" width="333" height="75" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="440" y="226" fill="#fde047" font-size="16" font-weight="900">📍【2F 專區】24H 洗烘衣機 ＆ 免費製冰機</text>
  <text x="440" y="248" fill="#e2e8f0" font-size="14" font-weight="700">• 洗衣機2台(¥200/次‧自動投入洗劑免買洗衣精！)</text>
  <text x="440" y="268" fill="#e2e8f0" font-size="14" font-weight="700">• 烘衣機2台(¥100/30分) ‧ 24H免費製冰機 ‧ 啤酒販賣機</text>

  <!-- Bottom Left Box: In-Room Equipment & Free Rentals -->
  <rect x="25" y="302" width="370" height="215" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
