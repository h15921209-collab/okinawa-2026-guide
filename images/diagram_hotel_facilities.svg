  <text x="210" y="330" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900">🛏️ 房間內建設備 ＆ 1F 櫃檯免費借用</text>
  <text x="42" y="366" fill="#065f46" font-size="16" font-weight="900">✅ 房內標配（全室席夢思 120cm 寬名床）：</text>
  <text x="42" y="390" fill="#0f172a" font-size="14" font-weight="700">• 空冰箱、快煮壺、隱藏式咖啡茶包組、連身睡衣</text>
  <text x="42" y="412" fill="#0f172a" font-size="14" font-weight="700">• 衣物除臭噴霧、全身鏡(180cm)、高水壓SPA按摩蓮蓬頭</text>
  <rect x="40" y="426" width="340" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="52" y="450" fill="#047857" font-size="15" font-weight="900">🎁 向 1F 櫃檯「免費借用」隱藏清單（先借先贏）：</text>
  <text x="52" y="472" fill="#0f172a" font-size="14" font-weight="700">加濕器、空氣清淨機、手機充電器、額外毛毯、</text>
  <text x="52" y="492" fill="#0f172a" font-size="14" font-weight="700">體溫計、指甲剪、熨斗、開瓶器、雨傘（雨天）</text>

  <!-- Bottom Right Box: Check-in / Kids Rule -->
  <rect x="410" y="302" width="365" height="215" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <rect x="410" y="302" width="365" height="42" rx="13" fill="#d97706"/>
  <text x="592" y="330" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900">⏰ 入住退房時間 ＆ 小學生訂房防呆</text>
  <text x="426" y="366" fill="#92400e" font-size="16" font-weight="900">🕒 入住 15:00 後 ／ 退房 11:00 前（比10:00晚1小時！）</text>
  <text x="426" y="390" fill="#0f172a" font-size="14" font-weight="700">• 退房後行李可免費寄放 1F 櫃檯到下午 15:40 領取</text>
  <text x="426" y="412" fill="#0f172a" font-size="14" font-weight="700">• 房門採非接觸式 IC 感應房卡，入住時先結清房費</text>
  <rect x="426" y="426" width="333" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="438" y="448" fill="#b91c1c" font-size="15" font-weight="900">⚠️ 官網規定：免費不佔床僅限「未就學幼童(6歲以下)」</text>
  <text x="438" y="470" fill="#7f1d1d" font-size="13" font-weight="700">11歲群祐＆7歲唯唯屬小學生，訂房網請設定「2大2小」</text>
  <text x="438" y="490" fill="#7f1d1d" font-size="13" font-weight="700">推薦訂【かりゆし3床房(3張120cm床)】或家庭方案最寬敞！</text>
</svg>
