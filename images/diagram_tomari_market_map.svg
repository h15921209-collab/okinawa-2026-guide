<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#8A6A4B" opacity="0.14"/>
    </pattern>
  </defs>
  <!-- Washi Stationery Paper Background -->
  <rect width="840" height="540" rx="20" fill="#FAF6F0"/>
  <rect width="840" height="540" rx="20" fill="url(#dots)"/>
  <rect x="12" y="12" width="816" height="516" rx="16" fill="none" stroke="#E6DDD0" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="28" width="780" height="62" rx="12" fill="#FFFEFC" stroke="#DFD5C5" stroke-width="1.2"/>
  <rect x="44" y="42" width="6" height="34" rx="3" fill="#B85A45"/>
  <text x="64" y="57" fill="#2C4356" font-size="20" font-weight="bold" font-family="'LXGW WenKai TC', 'Noto Serif TC', serif">泊港魚市場（泊いゆまち）｜在地老饕 DIY 海陸拼桌實戰圖解</text>
  <text x="64" y="79" fill="#6A625B" font-size="12" font-family="'Noto Sans TC', sans-serif">營業時間：06:00–18:00（黃金採買 09:30–10:45）｜地址：那覇市港町 1-1-18｜攤位多數只收日圓現金</text>

  <!-- Card 1: 鮮魚・卸 神谷 -->
  <g transform="translate(30, 110)">
    <rect width="378" height="188" rx="14" fill="#FFFEFC" stroke="#DFD5C5" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="14" fill="#F9EFEA" stroke="#EAD4CA"/>
    <text x="30" y="35" fill="#B85A45" font-size="14" font-weight="bold" text-anchor="middle" font-family="serif">壹</text>
    <text x="54" y="34" fill="#2C4356" font-size="16" font-weight="bold" font-family="'LXGW WenKai TC', serif">鮮魚・卸 神谷（神谷鮮魚）</text>
    <rect x="278" y="18" width="84" height="22" rx="11" fill="#EFF4F0" stroke="#D4E0D7"/>
    <text x="320" y="33" fill="#55715E" font-size="11" font-weight="bold" text-anchor="middle">生魚片首選</text>

    <line x1="18" y1="52" x2="360" y2="52" stroke="#EDE6DB" stroke-dasharray="4 3"/>
    <text x="18" y="74" fill="#B85A45" font-size="13" font-weight="bold">老饕必挑：現切非冷凍黑鮪魚大腹／三拼盒</text>
    <text x="18" y="98" fill="#4A433D" font-size="12">• 沖繩近海現撈未冷凍本鮪，油花入口即化（約 1,200~1,500円）</text>
    <text x="18" y="120" fill="#4A433D" font-size="12">• 記得順手挑一盒超平價鮮綠「海葡萄」配白飯吃</text>
    <rect x="18" y="140" width="342" height="32" rx="8" fill="#FAF6F0" stroke="#E6DDD0"/>
    <text x="189" y="160" fill="#2C4356" font-size="11.5" font-weight="bold" text-anchor="middle">攻略：外帶單買現切刺身盒鮮度最高、價格最實在！</text>
  </g>

  <!-- Card 2: 三高水產 ＆ まぐろ屋 みーかがん -->
  <g transform="translate(432, 110)">
    <rect width="378" height="188" rx="14" fill="#FFFEFC" stroke="#DFD5C5" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="14" fill="#F9EFEA" stroke="#EAD4CA"/>
    <text x="30" y="35" fill="#B85A45" font-size="14" font-weight="bold" text-anchor="middle" font-family="serif">貳</text>
    <text x="54" y="34" fill="#2C4356" font-size="16" font-weight="bold" font-family="'LXGW WenKai TC', serif">三高水產 ＆ 直營 みーかがん</text>
    <rect x="278" y="18" width="84" height="22" rx="11" fill="#F5EFE6" stroke="#DFD5C5"/>
    <text x="320" y="33" fill="#8A6A4B" font-size="11" font-weight="bold" text-anchor="middle">熱湯與熟食</text>

    <line x1="18" y1="52" x2="360" y2="52" stroke="#EDE6DB" stroke-dasharray="4 3"/>
    <text x="18" y="74" fill="#B85A45" font-size="13" font-weight="bold">小孩救星：熱白飯 ＋ 鮮魚骨湯 ＋ 鰻魚＆天婦羅</text>
    <text x="18" y="98" fill="#4A433D" font-size="12">• 沖繩最大鮪魚買付商直營！熟食區買現烤海膽干貝／龍蝦</text>
    <text x="18" y="120" fill="#4A433D" font-size="12">• 旁邊直營食堂買熱魚骨湯（アラ汁）／墨魚湯＋兒童鰻魚丼</text>
    <rect x="18" y="140" width="342" height="32" rx="8" fill="#FAF6F0" stroke="#E6DDD0"/>
    <text x="189" y="160" fill="#2C4356" font-size="11.5" font-weight="bold" text-anchor="middle">攻略：用熱飯熱湯配神谷生魚片，DIY 出無敵海陸大餐！</text>
  </g>

  <!-- Card 3: 中真水產 ＆ 坂下水產 -->
  <g transform="translate(30, 316)">
    <rect width="378" height="192" rx="14" fill="#FFFEFC" stroke="#DFD5C5" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="14" fill="#F9EFEA" stroke="#EAD4CA"/>
    <text x="30" y="35" fill="#B85A45" font-size="14" font-weight="bold" text-anchor="middle" font-family="serif">參</text>
    <text x="54" y="34" fill="#2C4356" font-size="16" font-weight="bold" font-family="'LXGW WenKai TC', serif">中真水產 ＆ 坂下水產（獨立兩攤）</text>
    <rect x="278" y="18" width="84" height="22" rx="11" fill="#F5EFE6" stroke="#DFD5C5"/>
    <text x="320" y="33" fill="#8A6A4B" font-size="11" font-weight="bold" text-anchor="middle">貝類與壽司</text>

    <line x1="18" y1="52" x2="360" y2="52" stroke="#EDE6DB" stroke-dasharray="4 3"/>
    <text x="18" y="74" fill="#2C4356" font-size="13" font-weight="bold">• 中真水產（Nakama）：夜光貝、伊勢龍蝦等貝甲仲卸</text>
    <text x="18" y="96" fill="#4A433D" font-size="12">  可詢問現場切生魚片或簡單加熱調理，價格先問清楚再點</text>
    <text x="18" y="120" fill="#2C4356" font-size="13" font-weight="bold">• 坂下水產（Google 3.5★）：自有醋飯壽司、海膽與大生蠔</text>
    <rect x="18" y="142" width="342" height="34" rx="8" fill="#F9EFEA" stroke="#EAD4CA"/>
    <text x="189" y="163" fill="#B85A45" font-size="11.5" font-weight="bold" text-anchor="middle">提醒：兩家為完全不同獨立攤位，熟食請挑剛出爐或現場炙燒！</text>
  </g>

  <!-- Card 4: 老饕避雷鐵則 -->
  <g transform="translate(432, 316)">
    <rect width="378" height="192" rx="14" fill="#FFFEFC" stroke="#EAD4CA" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#B85A45"/>
    <text x="30" y="35" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="serif">警</text>
    <text x="54" y="34" fill="#B85A45" font-size="16" font-weight="bold" font-family="'LXGW WenKai TC', serif">實戰防呆！老饕三大避雷紅線</text>

    <line x1="18" y1="52" x2="360" y2="52" stroke="#EAD4CA" stroke-dasharray="4 3"/>
    <text x="18" y="76" fill="#2F2A26" font-size="12.5" font-weight="bold">1. 熟食防冷雷：避開沒保溫已冷掉的乾癟預烤大明蝦！</text>
    <text x="18" y="98" fill="#6A625B" font-size="11.5">   一定要挑剛炸好天婦羅（魚/もずく海蘊）或現用噴槍炙燒的</text>
    <text x="18" y="122" fill="#2F2A26" font-size="12.5" font-weight="bold">2. 價格坑警訊：中文熱情招呼的代客熱炒先問清總價</text>
    <text x="18" y="142" fill="#6A625B" font-size="11.5">   （實測評論曾有三道熱炒結帳 9,000 円經驗）</text>
    <text x="18" y="166" fill="#2F2A26" font-size="12.5" font-weight="bold">3. 丼飯評比：まぐろや本舗 (4.0★) 尖峰常等20分且評價兩極</text>
    <text x="18" y="182" fill="#6A625B" font-size="11.5">   不如外帶刺身配熱湯白飯，去共用席或戶外海邊桌吃更快更鮮！</text>
  </g>
</svg>
