<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hdrT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bgT)"/>
  <rect x="30" y="25" width="740" height="55" rx="12" fill="url(#hdrT)"/>
  <text x="400" y="60" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">🐟 泊港魚市場（泊いゆまち）四大王牌攤位直擊攻略地圖</text>

  <!-- Stall 1: 神谷生魚片 -->
  <g transform="translate(40, 105)">
    <rect width="340" height="165" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="16" fill="#0284c7"/>
    <text x="31" y="37" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="55" y="37" fill="#38bdf8" font-size="16" font-weight="bold">神谷本まぐろ（生鮮黑鮪魚首選）</text>
    <text x="15" y="72" fill="#f8fafc" font-size="13" font-weight="bold">👑 招牌必點：現剖黑鮪魚大腹（大トロ）刺身</text>
    <text x="15" y="97" fill="#cbd5e1" font-size="12">• 沖繩近海現撈「非冷凍」黑鮪魚，油脂豐厚入口即化</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="12">• 大腹/中腹/赤身三拼豪華盒裝，價格僅本島一半</text>
    <rect x="15" y="132" width="310" height="24" rx="6" fill="#0369a1"/>
    <text x="170" y="149" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">推薦指數：★★★★★ (老饕必衝現切生魚片)</text>
  </g>

  <!-- Stall 2: 中真水產 -->
  <g transform="translate(420, 105)">
    <rect width="340" height="165" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="16" fill="#d97706"/>
    <text x="31" y="37" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="55" y="37" fill="#fbbf24" font-size="16" font-weight="bold">中真水產（代客炭烤 ＆ 夜光貝兩吃）</text>
    <text x="15" y="72" fill="#f8fafc" font-size="13" font-weight="bold">👑 招牌必點：夜光貝兩吃 ＋ 炭烤巨大虎蝦</text>
    <text x="15" y="97" fill="#cbd5e1" font-size="12">• 沖繩名物夜光貝：一半刺身爽脆、一半蒜香奶油爆炒</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="12">• 炭烤大扇貝、焗烤帶殼生蠔現場現點現烤香氣四溢</text>
    <rect x="15" y="132" width="310" height="24" rx="6" fill="#b45309"/>
    <text x="170" y="149" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">推薦指數：★★★★★ (現烤海鮮香氣天花板)</text>
  </g>

  <!-- Stall 3: 三高水產 -->
  <g transform="translate(40, 290)">
    <rect width="340" height="165" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="16" fill="#db2777"/>
    <text x="31" y="37" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="55" y="37" fill="#f472b6" font-size="16" font-weight="bold">三高水產 / 坂下水產（熟食焗烤）</text>
    <text x="15" y="72" fill="#f8fafc" font-size="13" font-weight="bold">👑 招牌必點：起司焗烤龍蝦半隻 ＋ 烤鰻魚串</text>
    <text x="15" y="97" fill="#cbd5e1" font-size="12">• 滿滿厚起司覆蓋彈牙龍蝦肉，奶香濃郁小朋友最愛</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="12">• 現烤蒲燒鰻魚串、焗烤明太子蟹腳與酥炸唐揚雞</text>
    <rect x="15" y="132" width="310" height="24" rx="6" fill="#be185d"/>
    <text x="170" y="149" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">推薦指數：★★★★★ (不敢吃全生食與小孩救星)</text>
  </g>

  <!-- Stall 4: 鮪魚屋本舖 -->
  <g transform="translate(420, 290)">
    <rect width="340" height="165" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="16" fill="#059669"/>
    <text x="31" y="37" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">4</text>
    <text x="55" y="37" fill="#34d399" font-size="16" font-weight="bold">丼すしまぐろ屋本舗（冷氣內用丼飯）</text>
    <text x="15" y="72" fill="#f8fafc" font-size="13" font-weight="bold">👑 招牌必點：極上黑鮪魚大腹丼 ＆ 三色海鮮丼</text>
    <text x="15" y="97" fill="#cbd5e1" font-size="12">• 市場內唯一獨立室內冷氣座位，舒適坐著吃醋飯丼</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="12">• 醋飯搭配晶瑩鮭魚卵、生海膽與入口即化大腹鮪魚</text>
    <rect x="15" y="132" width="310" height="24" rx="6" fill="#047857"/>
    <text x="170" y="149" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">推薦指數：★★★★★ (唯一冷氣座位海鮮丼飯)</text>
  </g>
</svg>