<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="800" height="480" rx="24" fill="#0f172a"/>
  <text x="400" y="48" text-anchor="middle" fill="#fbbf24" font-size="25" font-weight="900">✈️ 【新手動線圖解 ①】下飛機 ➔ 搭單軌 ➔ 自由花園酒店動線</text>
  <!-- Step 1 -->
  <rect x="30" y="75" width="350" height="165" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="65" cy="110" r="20" fill="#0284c7"/><text x="65" y="118" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">1</text>
  <text x="98" y="116" fill="#38bdf8" font-size="22" font-weight="900">那霸機場 國際線 1F 入境</text>
  <text x="50" y="152" fill="#f8fafc" font-size="18" font-weight="700">• 領完行李走出玻璃門</text>
  <text x="50" y="182" fill="#f8fafc" font-size="18" font-weight="700">• 立刻搭「電梯/手扶梯」上 2樓</text>
  <text x="50" y="214" fill="#fde047" font-size="18" font-weight="900">👉 認頭頂指標：モノレール (Monorail)</text>
  <!-- Step 2 -->
  <rect x="420" y="75" width="350" height="165" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="455" cy="110" r="20" fill="#0284c7"/><text x="455" y="118" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">2</text>
  <text x="488" y="116" fill="#38bdf8" font-size="22" font-weight="900">走 2F 空橋進「那霸機場站」</text>
  <text x="440" y="152" fill="#f8fafc" font-size="18" font-weight="700">• 沿室內連通道直走 5 分鐘</text>
  <text x="440" y="182" fill="#f8fafc" font-size="18" font-weight="700">• 買票進站搭「ゆいレール」單軌</text>
  <text x="440" y="214" fill="#fde047" font-size="18" font-weight="900">👉 只有1條線！搭 19 分鐘到第11站</text>
  <!-- Step 3 -->
  <rect x="30" y="270" width="350" height="180" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
  <circle cx="65" cy="305" r="20" fill="#059669"/><text x="65" y="313" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">3</text>
  <text x="98" y="311" fill="#34d399" font-size="22" font-weight="900">第11站：おもろまち駅 下車</text>
  <text x="50" y="347" fill="#f8fafc" font-size="18" font-weight="700">• 出閘門後往左前走「西口」</text>
  <text x="50" y="377" fill="#f8fafc" font-size="18" font-weight="700">• 天橋盡頭左手邊搭「電梯」下 1F</text>
  <text x="50" y="412" fill="#86efac" font-size="18" font-weight="900">✅ 免扛行李走樓梯！輕鬆到地面</text>
  <!-- Step 4 -->
  <rect x="420" y="270" width="350" height="180" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="455" cy="305" r="20" fill="#d97706"/><text x="455" y="313" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">4</text>
  <text x="488" y="311" fill="#fbbf24" font-size="22" font-weight="900">平路直走 4 分鐘到飯店</text>
  <text x="440" y="347" fill="#f8fafc" font-size="18" font-weight="700">• 過斑馬線沿大馬路直走 300 公尺</text>
  <text x="440" y="377" fill="#f8fafc" font-size="18" font-weight="700">• 看到對面是 Apple Town 商場</text>
  <text x="440" y="412" fill="#fde047" font-size="18" font-weight="900">🏨 抵達「リブレガーデンホテル」！</text>
</svg>