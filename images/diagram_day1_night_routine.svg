  <text x="400" y="65" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">🌙 Day 1 首夜安歇防呆動線：西町漫步 ➔ 宵夜派對 ➔ 暖浴安眠</text>
  
  <!-- Step 1 -->
  <g transform="translate(50, 115)">
