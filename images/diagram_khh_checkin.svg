<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="800" height="450" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="44" text-anchor="middle" fill="#fbbf24" font-size="24" font-weight="900">🛫 【新手出發圖解】鳳山搭車 ➔ 小港機場 3F 報到 ➔ 行李安檢防呆</text>

  <rect x="25" y="70" width="240" height="350" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="145" y="108" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="900">① 15:00 鳳山出發</text>
  <text x="42" y="148" fill="#f8fafc" font-size="16" font-weight="700">• 叫 Uber / Yoxi 多元計程車</text>
  <text x="42" y="178" fill="#f8fafc" font-size="16" font-weight="700">• 設定：小港機場「國際線3F」</text>
  <text x="42" y="208" fill="#fde047" font-size="16" font-weight="900">• 車程約 20～25 分鐘</text>
  <rect x="42" y="235" width="206" height="160" rx="12" fill="#0c4a6e"/>
  <text x="145" y="268" text-anchor="middle" fill="#fde047" font-size="18" font-weight="900">台灣虎航 IT728</text>
  <text x="145" y="298" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="900">17:30 起飛 ➔ 19:55 那霸</text>
  <text x="145" y="330" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700">飛行僅 1小時25分</text>
  <text x="145" y="358" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="700">（機上免拿紙本入境卡）</text>

  <rect x="280" y="70" width="240" height="350" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
  <text x="400" y="108" text-anchor="middle" fill="#fb7185" font-size="20" font-weight="900">② 15:30 託運防呆</text>
  <rect x="296" y="130" width="208" height="125" rx="12" fill="#881337"/>
  <text x="400" y="162" text-anchor="middle" fill="#fde047" font-size="17" font-weight="900">🚫 絕對不可放託運箱：</text>
  <text x="400" y="192" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="900">• 行動電源 / 鋰電池</text>
  <text x="400" y="220" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">（必須放隨身背包帶上機）</text>
  <rect x="296" y="270" width="208" height="125" rx="12" fill="#064e3b"/>
  <text x="400" y="302" text-anchor="middle" fill="#6ee7b7" font-size="17" font-weight="900">💧 過安檢前倒空水壺：</text>
  <text x="400" y="332" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">帶空保溫瓶過安檢後，</text>
  <text x="400" y="358" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">在候機室裝溫水給群祐唯唯喝</text>

  <rect x="535" y="70" width="240" height="350" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="655" y="108" text-anchor="middle" fill="#34d399" font-size="20" font-weight="900">③ 16:00 人工查驗</text>
  <text x="552" y="148" fill="#f8fafc" font-size="16" font-weight="700">• 未滿12歲不可走自動通關</text>
  <text x="552" y="178" fill="#fde047" font-size="16" font-weight="900">• 全家4人一起走【人工櫃檯】</text>
  <rect x="552" y="210" width="206" height="185" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="655" y="242" text-anchor="middle" fill="#a5b4fc" font-size="17" font-weight="900">📱 候機室先開手機確認：</text>
  <text x="568" y="275" fill="#ffffff" font-size="15" font-weight="700">1. 相簿已存 4 張 VJW QR碼</text>
  <text x="568" y="305" fill="#ffffff" font-size="15" font-weight="700">2. 開啟日本漫遊 / eSIM</text>
  <text x="568" y="335" fill="#ffffff" font-size="15" font-weight="700">3. 先在候機室吃點心墊肚子</text>
  <text x="568" y="365" fill="#fde047" font-size="14" font-weight="700">（廉航機上禁食外食喔！）</text>
</svg>