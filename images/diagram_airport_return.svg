<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="800" height="440" rx="24" fill="#0f172a"/>
  <text x="400" y="44" text-anchor="middle" fill="#fbbf24" font-size="23" font-weight="900">🛫 【新手防呆圖解 ⑨】那霸機場「計程車直送 ➔ 國內線2F伴手禮 ➔ 國際線3F報到」</text>
  
  <!-- Box 1: Taxi to Airport -->
  <rect x="25" y="75" width="220" height="335" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="135" y="115" text-anchor="middle" fill="#38bdf8" font-size="21" font-weight="900">① 18:45 計程車直送</text>
  <text x="135" y="155" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">NEST NAHA ➔ 機場</text>
  <text x="135" y="190" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">（車程僅12分‧車資約1,500円）</text>
  <text x="135" y="222" text-anchor="middle" fill="#cbd5e1" font-size="16" font-weight="700">司機協助搬卸4件行李</text>
  <rect x="45" y="260" width="180" height="120" rx="12" fill="#0284c7"/>
  <text x="135" y="305" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">下車推免費手推車</text>
  <text x="135" y="335" text-anchor="middle" fill="#fde047" font-size="20" font-weight="900">先逛【國內線 2F】</text>
  <text x="135" y="362" text-anchor="middle" fill="#e0f2fe" font-size="15" font-weight="700">伴手禮都在國內線航廈！</text>

  <!-- Box 2: Domestic 2F -->
  <rect x="265" y="75" width="260" height="335" rx="18" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/>
  <text x="395" y="115" text-anchor="middle" fill="#713f12" font-size="22" font-weight="900">② 19:00–19:30 必逛！</text>
  <text x="395" y="148" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="900">🛍️ 國內線航廈 2 樓</text>
  <text x="282" y="188" fill="#0f172a" font-size="17" font-weight="900">✅ 全機場 90% 伴手禮都在這：</text>
  <text x="282" y="220" fill="#0f172a" font-size="16" font-weight="700">• Calbee+ 現炸紫薯薯條(必吃)</text>
  <text x="282" y="250" fill="#0f172a" font-size="16" font-weight="700">• 御菓子御殿 (元祖紅芋塔)</text>
  <text x="282" y="280" fill="#0f172a" font-size="16" font-weight="700">• 福砂屋長崎蛋糕</text>
  <text x="282" y="310" fill="#0f172a" font-size="16" font-weight="700">• Royce 石垣鹽巧克力洋芋片</text>
  <rect x="282" y="335" width="226" height="55" rx="10" fill="#ffffff"/>
  <text x="395" y="368" text-anchor="middle" fill="#b91c1c" font-size="16" font-weight="900">💡 國內線走連通道5分鐘至國際線</text>

  <!-- Box 3: International 3F -->
  <rect x="545" y="75" width="230" height="335" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="4"/>
  <text x="660" y="112" text-anchor="middle" fill="#fda4af" font-size="20" font-weight="900">③ 19:30 國際線 3F</text>
  <text x="660" y="142" text-anchor="middle" fill="#fde047" font-size="17" font-weight="900">🚨 順序別錯（免重排！）</text>
  <rect x="560" y="158" width="200" height="72" rx="10" fill="#9f1239"/>
  <text x="660" y="185" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="900">Step A：先過行李 X 光機</text>
  <text x="660" y="212" text-anchor="middle" fill="#fecdd3" font-size="14" font-weight="700">大行李箱先掃描貼封條！</text>
  <rect x="560" y="242" width="200" height="72" rx="10" fill="#065f46"/>
  <text x="660" y="269" text-anchor="middle" fill="#fde047" font-size="16" font-weight="900">Step B：再去虎航櫃檯報到</text>
  <text x="660" y="296" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">IT289 託運 ➔ 隨身安檢出境</text>
  <text x="660" y="348" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">21:30 起飛 ➔ 22:25 抵高雄</text>
  <text x="660" y="378" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">（出關領行李‧返鳳山溫暖家）</text>
</svg>